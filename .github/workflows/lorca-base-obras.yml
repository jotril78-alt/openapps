name: Verify and build Lorca lightweight database
on:
  push:
    paths:
      - 'lorca/inventario-maestro.json'
      - 'lorca/epubs/**'
      - 'lorca/bodas-de-sangre.html'
      - 'lorca/generar-base-obras.py'
      - '.github/workflows/lorca-base-obras.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate available books and create compact JSON
        run: python3 lorca/generar-base-obras.py
      - name: Commit only catalog when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lorca/base-obras.json
          git diff --cached --quiet || (git commit -m 'Refresh lightweight Lorca book database' && git push)
