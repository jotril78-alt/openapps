name: Lorca - Canciones EPUB integro (indice verificado)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lorca-canciones.yml'
      - 'scripts/lorca_canciones.py'
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas EPUB
        run: python -m pip install --quiet requests beautifulsoup4 ebooklib lxml
      - name: Importar obra y verificar poemas
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/lorca_canciones.py 2>&1 | tee lorca-canciones-importacion.log
      - name: Conservar diagnóstico de errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lorca-canciones-diagnostico
          path: lorca-canciones-importacion.log
          if-no-files-found: ignore
      - name: Guardar volumen verificado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lorca/epubs/canciones-1927.epub
          git diff --cached --quiet || (git commit -m "Lorca: EPUB íntegro de Canciones validado" && git push)
