name: Lorca - Canciones EPUB integro (diagnostico)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lorca-canciones.yml'
      - 'scripts/lorca_canciones.py'
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas EPUB
        run: python -m pip install --quiet requests beautifulsoup4 ebooklib lxml
      - name: Importar obra y generar diagnostico
        id: import
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/lorca_canciones.py 2>&1 | tee lorca-canciones-importacion.log
      - name: Registrar estado de importacion (tambien si falla)
        if: always()
        shell: bash
        env:
          RESULTADO: ${{ steps.import.outcome }}
          CORRIDA: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import pathlib,json,os,datetime
          log=pathlib.Path('lorca-canciones-importacion.log')
          lines=log.read_text(errors='replace').splitlines() if log.exists() else []
          output=pathlib.Path('lorca/importacion-canciones-estado.json')
          output.parent.mkdir(exist_ok=True)
          output.write_text(json.dumps({
             'resultado':os.environ.get('RESULTADO','desconocido'),
             'ejecucion':os.environ.get('CORRIDA',''),
             'fecha_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
             'epub_disponible':pathlib.Path('lorca/epubs/canciones-1927.epub').is_file(),
             'ultimas_lineas':lines[-25:]
          },ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Guardar EPUB y diagnostico
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lorca/importacion-canciones-estado.json
          if test -f lorca/epubs/canciones-1927.epub; then git add lorca/epubs/canciones-1927.epub; fi
          git diff --cached --quiet || (git commit -m "Lorca: estado importacion Canciones y EPUB validado si existe" && git pull --rebase && git push)
      - name: Conservar registro completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lorca-canciones-diagnostico
          path: lorca-canciones-importacion.log
          if-no-files-found: ignore
