<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bodas de sangre — Biblioteca Lorca</title><style>body{background:#f8f0dd;color:#29251f;font:26px/1.65 Georgia,serif;margin:0}main{max-width:850px;margin:auto;padding:20px}nav{position:sticky;top:0;background:#f8f0dd;padding:8px 0;border-bottom:1px solid #b6a98c}button,a{font:inherit}button{padding:9px;border:1px solid #998b76;border-radius:10px;background:white}article{white-space:normal}article p{margin:1em 0}article h2{font-size:1.3em}body.dark{background:#191919;color:#eee}body.dark nav{background:#191919}body.dark button{background:#333;color:white}#status{font-size:.7em}</style></head><body><main><a href="./index.html">← Biblioteca Lorca</a><h1>Bodas de sangre</h1><p>Federico García Lorca</p><nav><button onclick="change(2)">A+</button> <button onclick="change(-2)">A−</button> <button onclick="document.body.classList.toggle('dark')">🌙</button> <button onclick="save()">Guardar punto</button><button onclick="restore()">Continuar</button></nav><p id="status">Cargando la obra…</p><article id="book"></article><p><small>Texto original de Wikisource. La primera carga necesita Internet; después queda guardado en este navegador para lectura sin conexión mientras Chrome conserve sus datos.</small></p></main><script>let font=Number(localStorage.getItem('lorca-font')||26);function change(n){font=Math.max(18,Math.min(44,font+n));document.body.style.fontSize=font+'px';localStorage.setItem('lorca-font',font)}change(0);function save(){localStorage.setItem('lorca-scroll',String(scrollY));document.getElementById('status').textContent='Punto de lectura guardado'}function restore(){scrollTo(0,Number(localStorage.getItem('lorca-scroll')||0))}const titles=['Primer Acto','Segundo Acto','Tercer Acto'];async function load(){const book=document.getElementById('book'),status=document.getElementById('status');let sections=[];for(let i=0;i<3;i++){let key='lorca-bodas-act-'+i,html=localStorage.getItem(key);if(!html){try{let u='https://es.wikisource.org/w/api.php?action=parse&format=json&formatversion=2&prop=text&origin=*&page='+encodeURIComponent('Bodas de sangre/'+titles[i]);let r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json();if(!data.parse?.text)throw Error('Sin texto');let doc=new DOMParser().parseFromString(data.parse.text,'text/html');doc.querySelectorAll('script,style,nav,.mw-editsection,.reference,.reflist,.printfooter,.mw-parser-output>table').forEach(x=>x.remove());doc.querySelectorAll('a').forEach(a=>{a.replaceWith(document.createTextNode(a.textContent))});html=doc.body.innerHTML;localStorage.setItem(key,html)}catch(e){status.textContent='No se pudo descargar toda la obra. Comprueba Internet y vuelve a abrir esta página.';if(!sections.length)book.innerHTML='<p><a href="https://es.wikisource.org/wiki/Bodas_de_sangre">Leer en Wikisource</a></p>';return}}sections.push('<section><h2>'+titles[i]+'</h2>'+html+'</section>')}book.innerHTML=sections.join('');status.textContent='Obra cargada · tres actos · disponible sin conexión en este navegador';if(localStorage.getItem('lorca-scroll'))restore()}load()</script></body></html>
