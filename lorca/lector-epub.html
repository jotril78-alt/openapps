<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lector EPUB · Mi Biblioteca Lorca</title><style>*{box-sizing:border-box}body{margin:0;background:#c6b79c;color:#352b20;font-family:Georgia,serif}#app{height:100dvh;display:flex;flex-direction:column;gap:5px;padding:8px;max-width:1500px;margin:auto}header,footer{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;font:16px system-ui}header strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button,a.close{border:1px solid #b8a98f;border-radius:10px;background:#fffaf0;color:#32291f;font:inherit;padding:10px 13px;text-decoration:none;cursor:pointer}button:disabled{opacity:.35}#stage{flex:1;min-height:0;background:#fffaf0;box-shadow:4px 6px 0 #e6d8bc,8px 12px 25px #554a3b66;position:relative;overflow:hidden}#viewer{width:100%;height:100%}#message{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:25px;background:#fffaf0;font:18px/1.6 system-ui}#message[hidden]{display:none}footer{justify-content:center}#progress{min-width:180px;text-align:center}#close{font-size:24px;padding:4px 13px}body.dark{background:#171615;color:#f2e6d5}body.dark #stage,body.dark #message{background:#282521}body.dark button,body.dark a.close{background:#3c352d;color:#f2e6d5;border-color:#625746}@media(orientation:landscape){#app{padding:5px 12px}}</style></head><body><div id="app"><header><a id="close" class="close" href="./index.html#poesia" aria-label="Cerrar libro">×</a><strong id="title">Libro</strong><div><button id="minus" aria-label="Letra más pequeña">A−</button><button id="plus" aria-label="Letra más grande">A+</button><button id="night" aria-label="Modo nocturno">☾</button></div></header><div id="stage"><div id="viewer"></div><div id="message">Preparando el libro…</div></div><footer><button id="prev" aria-label="Página anterior">←</button><span id="progress">Cargando…</span><button id="next" aria-label="Página siguiente">→</button></footer></div><script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script><script>
const catalog={romancero:{title:'Romancero gitano',url:'./epubs/romancero-gitano.epub'},poemas:{title:'Libro de poemas',url:'./epubs/libro-de-poemas.epub'}};const id=new URLSearchParams(location.search).get('book')||'romancero',item=catalog[id]||catalog.romancero;document.getElementById('title').textContent=item.title;const message=document.getElementById('message'),progress=document.getElementById('progress');let book,rendition,font=Number(localStorage.getItem('lorca-epub-font')||115),dark=localStorage.getItem('lorca-epub-dark')==='1';const theme=()=>{document.body.classList.toggle('dark',dark);if(rendition)rendition.themes.default({body:{background:dark?'#282521':'#fffaf0',color:dark?'#f2e6d5':'#302820','font-family':'Georgia,serif','line-height':'1.65'}})};theme();
function fail(){message.hidden=false;message.innerHTML='<p>El EPUB todavía no está disponible o no se ha podido abrir. Estamos preparando una copia alojada en nuestra biblioteca.</p><p><a href="'+item.url+'">Descargar EPUB</a> · <a href="./index.html#poesia">Volver a Poesía</a></p>';progress.textContent='Lectura no disponible'}
async function start(){const check=await fetch(item.url,{method:'HEAD'}).catch(()=>null);if(!check||!check.ok){fail();return}if(typeof ePub!=='function'){fail();return}try{const response=await fetch(item.url);if(!response.ok)throw Error('EPUB no disponible');const bytes=await response.arrayBuffer();book=ePub(bytes);rendition=book.renderTo('viewer',{width:'100%',height:'100%',flow:'paginated',spread:'auto',minSpreadWidth:650});rendition.themes.fontSize(font+'%');theme();rendition.on('relocated',loc=>{try{localStorage.setItem('lorca-epub-pos-'+id,loc.start.cfi)}catch(e){};const pct=loc.start.percentage;progress.textContent=pct!=null?'Leído '+Math.round(pct*100)+'%':'Página de lectura';});const saved=localStorage.getItem('lorca-epub-pos-'+id);try{await Promise.race([rendition.display(saved||undefined),new Promise((_,reject)=>setTimeout(()=>reject(Error('Tiempo de espera agotado')),15000))]);}catch(e){if(!saved)throw e;localStorage.removeItem('lorca-epub-pos-'+id);await rendition.display();}message.hidden=true;book.ready.then(()=>book.locations.generate(1200)).then(()=>{rendition.on('relocated',loc=>{const current=book.locations.locationFromCfi(loc.start.cfi);progress.textContent='Posición '+(current+1)+' de '+book.locations.total})}).catch(()=>{})}catch(e){fail()}}
document.getElementById('prev').onclick=()=>rendition&&rendition.prev();document.getElementById('next').onclick=()=>rendition&&rendition.next();document.getElementById('plus').onclick=()=>{font=Math.min(180,font+10);localStorage.setItem('lorca-epub-font',font);rendition?.themes.fontSize(font+'%')};document.getElementById('minus').onclick=()=>{font=Math.max(80,font-10);localStorage.setItem('lorca-epub-font',font);rendition?.themes.fontSize(font+'%')};document.getElementById('night').onclick=()=>{dark=!dark;localStorage.setItem('lorca-epub-dark',dark?'1':'0');theme()};let startX=0;document.getElementById('stage').addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});document.getElementById('stage').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>65&&rendition)(dx<0?rendition.next():rendition.prev())},{passive:true});start();
</script></body></html>
