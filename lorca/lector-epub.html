<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lector EPUB · Mi Biblioteca Lorca</title><style>*{box-sizing:border-box}body{margin:0;background:#c6b79c;color:#352b20;font-family:Georgia,serif}#app{height:100dvh;display:flex;flex-direction:column;gap:5px;padding:8px;max-width:1500px;margin:auto}header,footer{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;font:16px system-ui}header strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button,a.close{border:1px solid #b8a98f;border-radius:10px;background:#fffaf0;color:#32291f;font:inherit;padding:10px 13px;text-decoration:none;cursor:pointer}button:disabled{opacity:.35}#stage{flex:1;min-height:0;background:#fffaf0;box-shadow:4px 6px 0 #e6d8bc,8px 12px 25px #554a3b66;position:relative;overflow:hidden}#viewer{width:100%;height:100%}#message{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:25px;background:#fffaf0;font:18px/1.6 system-ui}#message[hidden]{display:none}footer{justify-content:center}#progress{min-width:180px;text-align:center}#close{font-size:24px;padding:4px 13px}body.dark{background:#171615;color:#f2e6d5}body.dark #stage,body.dark #message{background:#282521}body.dark button,body.dark a.close{background:#3c352d;color:#f2e6d5;border-color:#625746}@media(orientation:landscape){#app{padding:5px 12px}}body,body.dark{background:#171615;color:#f2e6d5}#app{height:100dvh;max-width:none;padding:0;gap:0;position:relative}#stage,body.dark #stage{background:#24211e;box-shadow:none;border:0;flex:1}#viewer{height:100%;width:100%}header{position:absolute;z-index:10;left:0;right:0;top:0;min-height:44px;background:#171615d9;color:#f2e6d5;padding:3px 8px;transform:translateY(-110%);transition:transform .2s}header.show{transform:none}#close{position:fixed;top:6px;left:6px;z-index:15;background:#312a25d9;color:white;border:1px solid #77695a;font-size:24px;padding:2px 12px}header #close{position:static;visibility:hidden;min-width:46px}footer{position:absolute;bottom:0;left:0;right:0;z-index:10;min-height:44px;background:#171615d9;transform:translateY(110%);transition:transform .2s}footer.show{transform:none}button{background:#3c352d!important;color:#f2e6d5!important;border-color:#625746!important}#message{background:#24211e!important;color:#f2e6d5}#viewer iframe{border:0}#thumbnails{display:none;position:absolute;z-index:12;top:48px;left:0;right:0;padding:10px;background:#171615ed;overflow-x:auto;gap:8px;max-height:140px}#thumbnails.show{display:flex}.thumb{flex:0 0 110px;min-height:95px;background:#37312b;border:1px solid #8a7968;border-radius:4px;color:#f2e6d5;padding:8px;font:13px/1.4 Georgia,serif;text-align:left;white-space:normal;overflow:hidden}#voice,#speed{background:#3c352d;color:#f2e6d5;border:1px solid #625746;border-radius:8px;padding:7px}#stopRead[hidden]{display:none}#zoomnote{position:absolute;bottom:10px;right:10px;z-index:11;font:12px system-ui;opacity:.6;pointer-events:none}@media(orientation:landscape){#app{padding:0}} </style></head><body><div id="app"><a id="close" class="close" href="./index.html#poesia" aria-label="Cerrar libro">×</a><header id="toolbar"><span style="width:46px"></span><strong id="title">Libro</strong><div><button id="minus" aria-label="Letra más pequeña">A−</button><button id="plus" aria-label="Letra más grande">A+</button><button id="night" aria-label="Modo nocturno">☾</button><button id="listen" aria-label="Escuchar el libro">🔊 Leer</button><button id="stopRead" aria-label="Detener lectura" hidden>■</button><select id="voice" aria-label="Voz de lectura" style="max-width:125px"></select><select id="speed" aria-label="Velocidad de lectura"><option value="0.8" selected>Declamación</option><option value="1">Normal</option><option value="1.2">Rápida</option></select></div></header><div id="stage"><div id="viewer"></div><div id="thumbnails" aria-label="Navegación por capítulos"></div><div id="zoomnote">Toca el centro para mostrar controles</div><div id="message">Preparando el libro…</div></div><footer id="bottomBar"><button id="prev" aria-label="Página anterior">←</button><span id="progress">Cargando…</span><button id="next" aria-label="Página siguiente">→</button></footer></div><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script><script>
const catalog={romancero:{title:'Romancero gitano',url:'./epubs/romancero-gitano.epub'},poemas:{title:'Libro de poemas',url:'./epubs/libro-de-poemas.epub'}};const id=new URLSearchParams(location.search).get('book')||'romancero',item=catalog[id]||catalog.romancero;document.getElementById('title').textContent=item.title;const message=document.getElementById('message'),progress=document.getElementById('progress');let book,rendition,font=Number(localStorage.getItem('lorca-epub-font')||115),dark=localStorage.getItem('lorca-epub-dark')!=='0';const theme=()=>{document.body.classList.toggle('dark',dark);if(rendition)rendition.themes.default({body:{background:dark?'#282521':'#fffaf0',color:dark?'#f2e6d5':'#302820','font-family':'Georgia,serif','line-height':'1.65'}})};theme();
function fail(reason){console.error('EPUB Lorca:',reason);message.hidden=false;message.innerHTML='<p>El EPUB todavía no está disponible o no se ha podido abrir. Estamos preparando una copia alojada en nuestra biblioteca.</p><p><a href="'+item.url+'">Descargar EPUB</a> · <a href="./index.html#poesia">Volver a Poesía</a></p>';progress.textContent='Lectura no disponible';const note=document.createElement('small');note.textContent='Detalle técnico: '+(reason||'error desconocido');message.appendChild(note)}
async function start(){const check=await fetch(item.url,{method:'HEAD'}).catch(()=>null);if(!check||!check.ok){fail();return}if(typeof ePub!=='function'||typeof JSZip==='undefined'){fail('No se cargaron las bibliotecas EPUB.js / JSZip');return}try{const response=await fetch(item.url);if(!response.ok)throw Error('EPUB no disponible');const bytes=await response.arrayBuffer();book=ePub(bytes);rendition=book.renderTo('viewer',{width:'100%',height:'100%',flow:'paginated',spread:'auto',minSpreadWidth:650});rendition.themes.fontSize(font+'%');theme();rendition.on('rendered',(_,contents)=>{bindGestures(contents);activeContents=contents});rendition.on('relocated',loc=>{try{localStorage.setItem('lorca-epub-pos-'+id,loc.start.cfi)}catch(e){};const pct=loc.start.percentage;progress.textContent=pct!=null?'Leído '+Math.round(pct*100)+'%':'Página de lectura';});const saved=localStorage.getItem('lorca-epub-pos-'+id);try{await Promise.race([rendition.display(saved||undefined),new Promise((_,reject)=>setTimeout(()=>reject(Error('Tiempo de espera agotado')),15000))]);}catch(e){if(!saved)throw e;localStorage.removeItem('lorca-epub-pos-'+id);await rendition.display();}message.hidden=true;book.ready.then(()=>book.locations.generate(1200)).then(()=>{rendition.on('relocated',loc=>{const current=book.locations.locationFromCfi(loc.start.cfi);progress.textContent='Posición '+(current+1)+' de '+book.locations.total})}).catch(()=>{})}catch(e){fail(e?.message||String(e))}}
const toolbar=document.getElementById('toolbar'),bottomBar=document.getElementById('bottomBar'),thumbs=document.getElementById('thumbnails');let controls=false;
function controlsShow(force){controls=typeof force==='boolean'?force:!controls;toolbar.classList.toggle('show',controls);bottomBar.classList.toggle('show',controls);if(!controls)thumbs.classList.remove('show')}
function pageTurn(dir){if(reading)stopReading();if(!rendition)return;dir>0?rendition.next():rendition.prev()}
function bindGestures(contents){const doc=contents.document;if(!doc||doc.__lorcaGestures)return;doc.__lorcaGestures=true;let x=0,y=0,t=0;doc.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;x=e.touches[0].clientX;y=e.touches[0].clientY;t=Date.now()},{passive:true});doc.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2&&Date.now()-t<1400)pageTurn(dx<0?1:-1);else if(Math.abs(dx)<12&&Math.abs(dy)<12){const w=doc.documentElement.clientWidth;if(x<w*.12)pageTurn(-1);else if(x>w*.88)pageTurn(1);else controlsShow()}},{passive:true});doc.addEventListener('keydown',e=>{if(e.key==='ArrowRight')pageTurn(1);if(e.key==='ArrowLeft')pageTurn(-1)})}
document.getElementById('prev').onclick=()=>pageTurn(-1);document.getElementById('next').onclick=()=>pageTurn(1);
function zoom(delta){font=Math.max(80,Math.min(200,font+delta));localStorage.setItem('lorca-epub-font',font);rendition?.themes.fontSize(font+'%');if(font===80){thumbs.classList.add('show');controlsShow(true);thumbs.classList.add('show');}else thumbs.classList.remove('show')}
document.getElementById('plus').onclick=()=>zoom(10);document.getElementById('minus').onclick=()=>zoom(-10);
document.getElementById('night').onclick=()=>{dark=!dark;localStorage.setItem('lorca-epub-dark',dark?'1':'0');theme()};
let stageX=0,stageY=0;const stage=document.getElementById('stage');stage.addEventListener('touchstart',e=>{stageX=e.changedTouches[0].clientX;stageY=e.changedTouches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-stageX,dy=e.changedTouches[0].clientY-stageY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)pageTurn(dx<0?1:-1)},{passive:true});
stage.addEventListener('click',e=>{if(e.target===stage||e.target.id==='viewer')controlsShow()});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')pageTurn(1);if(e.key==='ArrowLeft')pageTurn(-1);if(e.key==='Escape')controlsShow(false)});
async function buildThumbs(){try{const nav=await book.loaded.navigation;const toc=nav.toc||[];const entries=toc.length?toc:[{label:'Inicio',href:book.spine.first().href}];for(const entry of entries){const b=document.createElement('button');b.className='thumb';b.textContent=entry.label||'Capítulo';b.onclick=()=>{rendition.display(entry.href);thumbs.classList.remove('show');controlsShow(false)};thumbs.appendChild(b)}}catch(e){console.warn('Navegación EPUB',e)}}
let activeContents=null,reading=false,paused=false,queue=[],chunkIndex=0,utterance=null,audioToken=0,spineIndex=-1;const synth=window.speechSynthesis,listen=document.getElementById('listen'),stopBtn=document.getElementById('stopRead'),voiceSelect=document.getElementById('voice'),speedSelect=document.getElementById('speed');
function voiceScore(v){const n=v.name.toLowerCase();return (v.lang.toLowerCase()==='es-es'?30:0)+(v.localService?5:0)+(/male|masculin|hombre|jorge|diego|pablo|enrique|antonio|carlos|alvaro|álvaro/.test(n)?20:0)+(/natural|neural|premium|enhanced/.test(n)?10:0)}
function voicesLoad(){if(!synth)return;const list=synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith('es'));const chosen=localStorage.getItem('lorca-voice')||'';voiceSelect.replaceChildren();for(const v of list){const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';voiceSelect.appendChild(o)}if(chosen&&list.some(v=>v.voiceURI===chosen))voiceSelect.value=chosen;else{const ranked=[...list].sort((a,b)=>voiceScore(b)-voiceScore(a));if(ranked.length)voiceSelect.value=ranked[0].voiceURI}}
if(synth){voicesLoad();synth.addEventListener?.('voiceschanged',voicesLoad)}
voiceSelect.onchange=()=>{localStorage.setItem('lorca-voice',voiceSelect.value);if(reading)stopReading()};
speedSelect.value=localStorage.getItem('lorca-speed')||'0.8';speedSelect.onchange=()=>{localStorage.setItem('lorca-speed',speedSelect.value);if(reading)stopReading()};
function stopReading(){audioToken++;reading=false;paused=false;queue=[];chunkIndex=0;if(synth)synth.cancel();listen.textContent='🔊 Leer';stopBtn.hidden=true}
function makeChunks(text){const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean),chunks=[];for(const line of lines){const sentences=line.match(/[^.!?;:]+[.!?;:]?/g)||[line];for(const sentence of sentences){let rest=sentence.trim();while(rest.length>150){let cut=rest.lastIndexOf(' ',150);if(cut<55)cut=150;chunks.push({text:rest.slice(0,cut),pause:180});rest=rest.slice(cut).trim()}if(rest)chunks.push({text:rest,pause:sentence.trim().match(/[.!?]$/)?460:220})}chunks.push({text:'',pause:650})}return chunks}
function extractText(doc){if(!doc?.body)return '';const clone=doc.body.cloneNode(true);clone.querySelectorAll('nav,script,style,svg,aside,footer,header').forEach(e=>e.remove());clone.querySelectorAll('p,div,li,h1,h2,h3,blockquote,section').forEach(e=>{if(e.children.length===0)e.appendChild(doc.createTextNode('\n'))});return clone.innerText||clone.textContent||''}
function currentSpineIndex(){const href=activeContents?.section?.href;const items=book?.spine?.spineItems||[];let idx=items.findIndex(x=>x.href===href);if(idx<0){const current=rendition?.currentLocation()?.start?.index;idx=Number.isInteger(current)?current:0}return idx}
async function nextAudioSection(token){if(!reading||token!==audioToken)return;const items=book?.spine?.spineItems||[];for(let i=spineIndex+1;i<items.length;i++){if(!reading||token!==audioToken)return;spineIndex=i;try{await rendition.display(items[i].href);if(!reading||token!==audioToken)return;const text=extractText(activeContents?.document);queue=makeChunks(text);chunkIndex=0;if(queue.some(x=>x.text.trim())){speakNext(token);return}}catch(e){console.warn('Sección no legible',e)}}stopReading();progress.textContent='Lectura en voz alta terminada'}
function speakNext(token){if(!reading||paused||token!==audioToken)return;if(chunkIndex>=queue.length){nextAudioSection(token);return}const phrase=queue[chunkIndex++];if(!phrase.text){setTimeout(()=>{if(reading&&!paused&&token===audioToken)speakNext(token)},phrase.pause);return}utterance=new SpeechSynthesisUtterance(phrase.text);utterance.lang='es-ES';utterance.rate=Number(speedSelect.value);utterance.pitch=0.92;
const selected=synth.getVoices().find(v=>v.voiceURI===voiceSelect.value);if(selected)utterance.voice=selected;utterance.onend=()=>{if(reading&&token===audioToken&&!paused)setTimeout(()=>{if(reading&&token===audioToken&&!paused)speakNext(token)},phrase.pause)};utterance.onerror=e=>{if(token!==audioToken||e.error==='interrupted'||e.error==='canceled')return;stopReading();listen.textContent='Error de voz'};synth.speak(utterance)}
function beginReading(){if(!synth||typeof SpeechSynthesisUtterance==='undefined'){alert('Este navegador no ofrece lectura en voz alta.');return}const doc=activeContents?.document;if(!doc){alert('Espera a que se abra el libro.');return}queue=makeChunks(extractText(doc));if(!queue.some(x=>x.text.trim())){alert('No hay texto disponible en esta sección.');return}reading=true;paused=false;chunkIndex=0;spineIndex=currentSpineIndex();const token=++audioToken;stopBtn.hidden=false;listen.textContent='⏸ Pausar';controlsShow(true);synth.cancel();speakNext(token)}
listen.onclick=()=>{if(!reading){beginReading();return}if(paused){paused=false;synth.resume();listen.textContent='⏸ Pausar'}else{paused=true;synth.pause();listen.textContent='▶ Seguir'}};
stopBtn.onclick=stopReading;document.getElementById('close').addEventListener('click',stopReading);addEventListener('pagehide',stopReading);

start();setTimeout(()=>{if(book)buildThumbs()},1200);
</script></body></html>
