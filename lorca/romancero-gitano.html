<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Romancero gitano — Mi Biblioteca Lorca</title><style>body{margin:0;background:#f7efd9;color:#29251f;font:26px/1.65 Georgia,serif}main{max-width:850px;margin:auto;padding:20px}nav{position:sticky;top:0;background:#f7efd9;padding:10px 0}button{font:inherit;padding:9px;border-radius:12px;border:1px solid #999;background:white}body.dark{background:#1c1b19;color:white}body.dark nav{background:#1c1b19}body.dark button{background:#333;color:white}#book{overflow-wrap:anywhere}#book img{max-width:100%;height:auto}</style></head><body><main><a href="./index.html">← Biblioteca Lorca</a><h1>Romancero gitano</h1><p>Federico García Lorca</p><nav><button onclick="size(2)">A+</button> <button onclick="size(-2)">A−</button> <button onclick="document.body.classList.toggle('dark')">🌙</button> <button onclick="localStorage.setItem('rg-scroll',scrollY)">Guardar punto</button> <button onclick="scrollTo(0,Number(localStorage.getItem('rg-scroll')||0))">Continuar</button></nav><p id="status">Cargando texto…</p><article id="book"></article><p>Fuente: <a href="https://es.wikisource.org/wiki/Romancero_gitano">Wikisource</a>.</p></main><script>let n=Number(localStorage.getItem('rg-size')||26);function size(d){n=Math.max(18,Math.min(44,n+d));document.body.style.fontSize=n+'px';localStorage.setItem('rg-size',n)}size(0);async function load(){let html=localStorage.getItem('rg-content');if(!html){try{let r=await fetch('https://es.wikisource.org/w/api.php?action=parse&format=json&formatversion=2&prop=text&origin=*&page=Romancero_gitano');let d=await r.json();if(!d.parse?.text)throw Error('Sin contenido');let doc=new DOMParser().parseFromString(d.parse.text,'text/html');doc.querySelectorAll('script,style,nav,.mw-editsection,.reference,.reflist').forEach(e=>e.remove());doc.querySelectorAll('a').forEach(e=>e.replaceWith(document.createTextNode(e.textContent)));html=doc.body.innerHTML;localStorage.setItem('rg-content',html)}catch(e){document.getElementById('status').textContent='No se pudo cargar. Abre la fuente original.';return}}document.getElementById('book').innerHTML=html;document.getElementById('status').textContent='Texto cargado. Guardado para lectura sin conexión mientras Chrome conserve sus datos.';scrollTo(0,Number(localStorage.getItem('rg-scroll')||0))}load()</script></body></html>
