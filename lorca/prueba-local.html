<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba local · Biblioteca Lorca</title><style>body{font:20px/1.5 Georgia,serif;background:#e9ddc7;color:#302820;margin:0}main{max-width:720px;margin:18px auto;background:#fffaf0;padding:28px}a,button{display:inline-block;margin:8px 0;padding:12px;color:#302820;background:#f4e6c9;border:1px solid #b4a489;border-radius:8px;font:inherit}article{border-bottom:1px solid #cdbfa8;padding:16px 0}.status{font:16px system-ui}</style></head><body><main><a href="./">← Biblioteca</a><h1>Libros guardados en la biblioteca</h1><p>Estas dos obras están almacenadas como EPUB en nuestra web. Puedes comprobar que el archivo se descarga, abrirlo en el lector o guardarlo en tu dispositivo.</p><div id="books"></div><p class="status" id="summary"></p></main><script>
const books=[['Romancero gitano','epubs/romancero-gitano.epub','romancero'],['Libro de poemas','epubs/libro-de-poemas.epub','poemas']];
const list=document.getElementById('books');let completed=0;
for(const [title,file,id] of books){const article=document.createElement('article');const heading=document.createElement('h2');heading.textContent=title;const status=document.createElement('p');status.className='status';status.textContent='Comprobando archivo…';const read=document.createElement('a');read.href='./lector-epub.html?book='+id;read.textContent='Leer';const save=document.createElement('a');save.href='./'+file;save.download=file.split('/').pop();save.textContent='Guardar EPUB';article.append(heading,status,read,document.createTextNode(' '),save);list.append(article);fetch('./'+file,{cache:'no-store'}).then(async r=>{if(!r.ok)throw Error('HTTP '+r.status);const bytes=new Uint8Array(await r.arrayBuffer());const zip=bytes[0]===80&&bytes[1]===75&&bytes[2]===3&&bytes[3]===4;if(!zip||bytes.length<10000)throw Error('Archivo inválido');status.textContent='✓ EPUB disponible · '+(bytes.length/1024).toFixed(0)+' KB';completed++}).catch(e=>{status.textContent='✗ No se pudo comprobar: '+e.message}).finally(()=>{document.getElementById('summary').textContent='Archivos comprobados correctamente: '+completed+' de '+books.length})}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
