<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poema del cante jondo · Mi Biblioteca Lorca</title><style>body{margin:0;background:#d1c2a5;color:#302820;font:21px/1.55 Georgia,serif}main{max-width:780px;margin:12px auto;padding:clamp(18px,5vw,48px);background:#fffaf0;min-height:95vh}h1{text-align:center;font-size:1.6em}button,a{font:inherit;color:inherit}button{padding:12px;margin:5px;border:1px solid #aa9c83;border-radius:8px;background:#f7ecd6;cursor:pointer}.poem p{margin:0 0 .65em}.poem br{line-height:1.35}#text{margin-top:28px}#text h2{text-align:center}.source{font:14px system-ui;color:#665e53}#status{font:16px system-ui}a{display:inline-block;padding:8px}@media(max-width:650px){body{font-size:19px}main{margin:0;min-height:100vh}}</style></head><body><main><a href="./">← Biblioteca</a><h1>Poema del cante jondo</h1><p style="text-align:center">Federico García Lorca · 1931</p><p>Elige una sección para leerla:</p><div id="chapters"></div><p id="status" role="status"></p><article class="poem" id="text"></article><p class="source">Texto consultado en Wikisource. Se utiliza una copia local cuando está disponible; si falta, se consulta Wikisource.</p></main><script>
const sections=['Baladilla de los tres ríos','Poema de la siguiriya gitana','Poema de la soleá','Poema de la saeta','Gráfico de la Petenera','Dos muchachas','Viñetas flamencas','Tres ciudades','Seis caprichos','Escena del teniente coronel de la Guardia Civil','Diálogo del Amargo'];
const holder=document.getElementById('chapters'),target=document.getElementById('text'),status=document.getElementById('status');
sections.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>read(i);holder.appendChild(b)});
async function read(i){const title=sections[i],key='lorca-cante-jondo-v1-'+i;status.textContent='Cargando '+title+'…';target.replaceChildren();let markup='';try{markup=sessionStorage.getItem(key)||''}catch(e){}
if(!markup){try{const local=await fetch('./textos/cante-jondo/seccion-'+String(i+1).padStart(2,'0')+'.html');if(local.ok){const candidate=await local.text();if(candidate.length>350)markup=candidate}}catch(e){} }if(!markup){try{const q=new URLSearchParams({action:'parse',format:'json',formatversion:'2',prop:'text',page:title,origin:'*'});const res=await fetch('https://es.wikisource.org/w/api.php?'+q);if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(!data.parse?.text)throw Error('No se ha encontrado la sección');const doc=new DOMParser().parseFromString(data.parse.text,'text/html');doc.querySelectorAll('script,style,nav,table,.mw-editsection,.reference,.reflist,.printfooter,.noprint').forEach(e=>e.remove());doc.querySelectorAll('a').forEach(a=>a.replaceWith(document.createTextNode(a.textContent)));const root=doc.querySelector('.mw-parser-output')||doc.body;markup=root.innerHTML;if((root.textContent||'').trim().length<120)throw Error('Texto insuficiente');try{sessionStorage.setItem(key,markup)}catch(e){}}catch(e){status.textContent='No se pudo cargar. Comprueba la conexión e inténtalo de nuevo.';return}}
const heading=document.createElement('h2');heading.textContent=title;target.appendChild(heading);const section=document.createElement('section');section.innerHTML=markup;target.appendChild(section);status.textContent='';target.scrollIntoView({behavior:'smooth',block:'start'})}
</script></body></html>
