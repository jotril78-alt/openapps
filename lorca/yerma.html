<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d6c7ac"><title>Yerma · Biblioteca Lorca</title><style>
*{box-sizing:border-box}body{margin:0;background:#cbbca1;color:#332b22;font:22px/1.55 Georgia,serif}body.dark{background:#171615;color:#eee3d2}
#reader{height:100dvh;display:flex;flex-direction:column;padding:8px;gap:7px;max-width:1500px;margin:auto}
header,footer{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:45px;font:16px/1.3 system-ui,sans-serif}
header strong{font-size:17px;text-align:center}button,.close{font:inherit;cursor:pointer;border:1px solid #b1a28a;background:#fff9eb;color:#32291f;border-radius:10px;padding:9px 13px;text-decoration:none;white-space:nowrap}button:disabled{opacity:.3}button:focus-visible,.close:focus-visible{outline:3px solid #a56d25}#pages{flex:1;min-height:0;overflow:hidden;position:relative;background:#fffaf0;border-radius:3px 12px 12px 3px;box-shadow:inset 6px 0 12px -10px #453a2d,4px 5px 0 #e6dac3,8px 9px 20px #65584766}#book{height:100%;overflow:hidden;column-fill:auto;column-gap:0;overflow-wrap:break-word;line-height:1.6;scroll-behavior:auto}#book section{break-inside:auto}#book h2{text-align:center;font-size:1.18em;margin:1em 0;break-after:avoid}#book p{margin:0 0 .7em}#book table{max-width:100%;font-size:.8em}#book img{max-width:100%}#book .mw-parser-output{display:contents}#status{position:absolute;inset:20px;display:grid;place-items:center;text-align:center;background:#fffaf0;z-index:2;font:18px system-ui}#status[hidden]{display:none}footer{justify-content:center}#count{min-width:135px;text-align:center;font-size:15px}#close{font-size:24px;font-weight:bold;padding:5px 14px}#controls{display:flex;gap:5px}#controls button{font-size:16px;padding:7px 10px}
body.dark #pages{background:#29251f;box-shadow:4px 6px 20px #0009}body.dark button,body.dark .close{background:#3d362e;color:#f4eadb;border-color:#65594b}body.dark #status{background:#29251f}
@media(orientation:landscape){#reader{padding:6px 15px}#pages:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:linear-gradient(90deg,#b5a58d70,#fff8e900);box-shadow:0 0 12px #4e443e40;pointer-events:none}body.dark #pages:after{background:#514b43}}
</style><style id="lorca-audio-style">#lorcaAudioBtn{font:inherit;padding:10px 14px;border-radius:10px;cursor:pointer}#lorcaAudioOverlay[hidden]{display:none!important}#lorcaAudioOverlay{position:fixed;inset:0;z-index:1000;background:#000c;display:flex;align-items:center;justify-content:center;padding:12px}#lorcaAudioCard{background:#231e1b;color:#f5eddf;border:1px solid #8a7868;border-radius:12px;padding:18px;width:min(94vw,780px);box-shadow:0 10px 40px #0008;font:16px/1.5 system-ui}#lorcaAudioCard button{font:inherit;padding:9px 12px;border-radius:8px;cursor:pointer}#lorcaAudioCard a{color:#d9c7ac}#lorcaAudioFrame iframe{width:100%;aspect-ratio:16/9;border:0;background:#000}</style></head><body><div id="reader"><header><a class="close" id="close" href="./index.html#teatro" aria-label="Cerrar libro e ir a Teatro">×</a><strong>Yerma</strong><button type="button" id="lorcaAudioBtn" aria-label="Reproducir audiolibro interpretado">🎧 Audiolibro</button><div id="controls"><button onclick="change(-2)" aria-label="Disminuir letra">A−</button><button onclick="change(2)" aria-label="Aumentar letra">A+</button><button onclick="night()" aria-label="Modo noche">☾</button></div></header><div id="pages"><div id="status">Cargando la obra…</div><article id="book"></article></div><footer><button id="prev" onclick="turn(-1)" aria-label="Página anterior">←</button><span id="count" aria-live="polite">Página —</span><button id="next" onclick="turn(1)" aria-label="Página siguiente">→</button></footer></div><script>
const book=document.getElementById('book'),pages=document.getElementById('pages'),status=document.getElementById('status'),count=document.getElementById('count');let font=Number(localStorage.getItem('lorca-font')||22),page=0,total=1,spread=1,pw=0;const key='lorca-bodas-page-v3';
function night(){document.body.classList.toggle('dark');localStorage.setItem('lorca-night',document.body.classList.contains('dark')?'1':'0')}if(localStorage.getItem('lorca-night')==='1')document.body.classList.add('dark');
function change(n){font=Math.max(16,Math.min(36,font+n));localStorage.setItem('lorca-font',font);layout(true)}
function layout(keep){const oldRatio=total>1?page/(total-1):0;spread=matchMedia('(orientation: landscape)').matches?2:1;const w=pages.clientWidth,h=pages.clientHeight;pw=w/spread;book.style.fontSize=font+'px';book.style.width=w+'px';book.style.height=h+'px';book.style.columnWidth=pw+'px';book.style.columnGap='0px';book.style.padding='22px 26px';book.style.columnWidth=(pw-52)+'px';book.style.columnGap='52px';requestAnimationFrame(()=>{total=Math.max(1,Math.ceil((book.scrollWidth+1)/pw));page=keep?Math.round(oldRatio*(total-1)):Math.min(total-1,Number(localStorage.getItem(key)||0));page=Math.max(0,Math.min(total-1,page));page=spread===2?Math.floor(page/2)*2:page;show()})}
function show(){book.scrollLeft=page*pw;count.textContent=spread===2&&page+1<total?'Páginas '+(page+1)+'–'+(page+2)+' de '+total:'Página '+(page+1)+' de '+total;document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page+spread>=total;localStorage.setItem(key,String(page))}
function turn(n){page=Math.max(0,Math.min(total-1,page+n*spread));if(spread===2)page=Math.floor(page/2)*2;show()}
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>layout(true),180)});
const titles=['Primer Acto','Segundo Acto','Tercer Acto'];
async function load(){let parts=[];for(let j=0;j<titles.length;j++){let key2='lorca-yerma-act-'+j,html=localStorage.getItem(key2);if(!html){try{const local=await fetch('./textos/yerma/acto-'+(j+1)+'.html',{cache:'force-cache'});if(local.ok){html=await local.text();if(html.length<3000)html=null}}catch(e){console.warn('Copia local no disponible',e)}if(!html)try{const r=await fetch('https://es.wikisource.org/w/api.php?action=parse&format=json&formatversion=2&prop=text&origin=*&page='+encodeURIComponent('Yerma/'+titles[j]));const data=await r.json();if(!data.parse?.text)throw Error('Sin texto');const doc=new DOMParser().parseFromString(data.parse.text,'text/html');doc.querySelectorAll('script,style,nav,.mw-editsection,.reference,.reflist,.printfooter,.mw-parser-output>table').forEach(x=>x.remove());doc.querySelectorAll('a').forEach(a=>a.replaceWith(document.createTextNode(a.textContent)));html=doc.body.innerHTML;localStorage.setItem(key2,html)}catch(e){status.textContent='No se pudo cargar la obra. Comprueba la conexión y vuelve a abrirla.';return}}parts.push('<section><h2>'+titles[j]+'</h2>'+html+'</section>')}book.innerHTML=parts.join('');status.hidden=true;layout(false)}
load();
</script><div id="lorcaAudioOverlay" hidden role="dialog" aria-modal="true" aria-label="Audiolibro"><div id="lorcaAudioCard"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><strong>Yerma · adaptación dramática histórica</strong><button type="button" id="lorcaAudioClose">✕ Cerrar</button></div><p>Adaptación teatral de Yerma (grabación histórica; no es lectura literal) · se reproduce desde YouTube con Internet.</p><div id="lorcaAudioFrame"></div><p><a href="https://www.youtube.com/watch?v=ovJTEuFnjAw" target="_blank" rel="noopener">Abrir en YouTube si no se reproduce</a></p></div></div><script>(function(){const panel=document.getElementById('lorcaAudioOverlay'),frame=document.getElementById('lorcaAudioFrame');function close(){frame.replaceChildren();panel.hidden=true}document.getElementById('lorcaAudioClose').onclick=close;document.getElementById('lorcaAudioBtn').onclick=function(){const iframe=document.createElement('iframe');iframe.src='https://www.youtube-nocookie.com/embed/ovJTEuFnjAw?autoplay=1&playsinline=1&rel=0';iframe.title='Yerma · adaptación dramática histórica';iframe.allow='autoplay;encrypted-media;picture-in-picture';iframe.allowFullscreen=true;frame.replaceChildren(iframe);panel.hidden=false};panel.addEventListener('click',e=>{if(e.target===panel)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden)close()})})();</script></body></html>
